name: ONYX CI

on:
  push:
    branches:
      - main
      - "phase/**"
      - "feat/**"
      - "fix/**"
      - "refine/**"
  pull_request:
    branches:
      - main
  pull_request_target:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build, and SEO validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Build and prerender
        run: pnpm build

      - name: Validate SEO and crawl artifacts
        run: pnpm validate:seo

      - name: Validate accessibility
        run: pnpm validate:a11y

      - name: Validate performance budgets
        run: pnpm validate:performance

      - name: Verify prerendered routes
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          for locale in en fa; do
            for page in product solutions architecture security roadmap about resources contact investors pricing customers; do
              test -f "dist/public/$locale/$page/index.html"
            
            done
          done
          grep -q '<html lang="en" dir="ltr">' dist/public/en/index.html
          for page in product solutions architecture security roadmap about resources contact investors pricing customers; do
            grep -q '<html lang="fa" dir="rtl">' "dist/public/fa/$page/index.html"
          done
          grep -q '<html lang="fa" dir="rtl">' dist/public/fa/index.html
          grep -q '<div id="root">' dist/public/en/index.html
          grep -q '<div id="root">' dist/public/fa/index.html
          grep -q 'ONYX | Product' dist/public/en/product/index.html
          grep -q 'ONYX | معماری' dist/public/fa/architecture/index.html
          if grep -RqiE '>Light mode<|>Dark mode<|>Back to home<' dist/public/fa; then
            echo 'English UI labels remain in the Farsi prerendered surface.'
            exit 1
          fi
