name: ONYX CI

on:
  push:
    branches:
      - main
      - "phase/**"
      - "feat/**"
      - "fix/**"
      - "refine/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build, and SEO validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Build and prerender
        run: pnpm build

      - name: Validate SEO and crawl artifacts
        run: pnpm validate:seo

      - name: Verify prerendered routes
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          test -f dist/public/en/index.html
          test -f dist/public/fa/index.html
          grep -q '<html lang="en" dir="ltr">' dist/public/en/index.html
          grep -q '<html lang="fa" dir="rtl">' dist/public/fa/index.html
          grep -q '<div id="root">' dist/public/en/index.html
          grep -q '<div id="root">' dist/public/fa/index.html
