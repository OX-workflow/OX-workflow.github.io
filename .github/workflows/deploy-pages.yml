name: Deploy ONYX static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm validate:seo
      - run: pnpm validate:a11y
      - run: pnpm validate:performance

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for path in / /en/ /fa/ /en/product/ /en/solutions/ /en/architecture/ /en/security/ /en/roadmap/ /en/about/ /en/resources/ /en/contact/ /en/investors/ /en/pricing/ /en/customers/ /fa/product/ /fa/customers/; do
            curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL%/}${path}" >/tmp/onyx-page.html
            grep -q '<title>' /tmp/onyx-page.html
          done
          echo "Production Pages smoke test passed for core English and Farsi routes."
