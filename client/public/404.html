<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=/?p=/assets" />
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var query = window.location.search || "";
        var hash = window.location.hash || "";
        window.location.replace("/?p=" + encodeURIComponent(path + query + hash));
      })();
    </script>
    <title>Redirecting to ONYX Framework</title>
  </head>
  <body>
    <p>Redirecting to the ONYX Framework.</p>
  </body>
</html>
