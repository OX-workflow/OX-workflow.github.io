    <circle cx="196" cy="170" r="118" fill="none" stroke="url(#highlight)" stroke-width="2"/>
    <path d="M122 94 A118 118 0 0 1 266 76" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="5" stroke-linecap="round"/>
    <text x="450" y="202" fill="#FFFFFF" font-family="ONYX Manrope, Manrope, Arial, sans-serif" font-size="116" font-weight="700" letter-spacing="18">ONYX</text>
  </g>
</svg>