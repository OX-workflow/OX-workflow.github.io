<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 492" role="img" aria-labelledby="title desc">
  <title id="title">ONYX Mission Operations Platform</title>
  <desc id="desc">ONYX luminous circular symbol and white wordmark for dark surfaces.</desc>
  <defs>
    <linearGradient id="ring" x1="8%" y1="92%" x2="92%" y2="8%"><stop offset="0" stop-color="#D04DFF"/><stop offset="28%" stop-color="#5D2BFF"/><stop offset="55%" stop-color="#1747FF"/><stop offset="78%" stop-color="#078BFF"/><stop offset="100%" stop-color="#39E5FF"/></linearGradient>
    <linearGradient id="highlight" x1="10%" y1="90%" x2="90%" y2="10%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".82"/><stop offset="30%" stop-color="#FFFFFF" stop-opacity=".15"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity=".74"/></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="11" result="b"/><feColorMatrix in="b" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.24 0 0 0 0 1 0 0 0 .7 0" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(54 34)">
